build:
  maxIssues: 0

config:
  validation: true

style:
  MagicNumber:
    active: false
  NewLineAtEndOfFile:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  WildcardImport:
    active: true

complexity:
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
